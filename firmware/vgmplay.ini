; vgmplay.ini -- master (Raspberry Pi Pico) configuration
;
; Copy this file to the ROOT of the SD card (next to your .vgm/.vgz files).
; It is optional: with no file, the built-in defaults below are used.
; Read over USB CDC / UART at boot to confirm what was applied
; (see docs/design-notes.md 8.1).
;
; One [section] per sound chip. Keys (case-insensitive):
;   enabled = yes | no     turn this chip's slave on/off. Disabled = its CS GPIO
;                          is left free, and any .vgm/.vgz that needs this chip
;                          is skipped (not played with that voice missing).
;   cs      = <0-28>        master GPIO wired to this slave's chip-select.
;   gap     = <microsec>    optional: per-byte CS-pulse gap. Raise if a slave
;                          drops bytes (garbled sound); lower for tighter
;                          tempo. Default 40 (AY-3-8910 120, YM2151 0).
;                          gap = 0 -> BURST mode: all 3 bytes under one CS
;                          assertion (~6us/frame vs ~370us). The bus runs SPI
;                          mode 1 (CPHA=1) so this is reliable; it is the
;                          default for YM2151 (FM-dense music needs it). If a
;                          particular slave's link is marginal on burst
;                          (garbled notes / noise), set a nonzero gap here.
;   volume  = <0-255>       optional: this chip's output level, percent of
;                          unity (default 100). Chips sharing one analog mix
;                          can come out at very different native loudness for
;                          the same musical intent -- on one board, AY-3-8910
;                          needed volume=50 to balance against this project's
;                          SCC output (what had looked like a melody/timing
;                          bug on some AY+SCC songs was this: see
;                          docs/design-notes.md "Hot Summer Riding").
;                          Tune per your own board's analog mix; there's no
;                          universally-correct value.
;
; Section names ignore case, dashes, underscores and spaces, so [AY-3-8910],
; [ay8910] and [Ay_8910] are the same. Lines starting with ; or # are
; comments. Anything you leave out keeps its default.
;
; One more section, not a chip -- general playback behaviour:
;   [player]
;   shuffle = no | yes      default no (play the SD card root's .vgm/.vgz in
;                          case-insensitive alphabetical order). yes plays
;                          them in a freshly-randomised order instead,
;                          re-shuffled every time the whole card is replayed.
;   skip_button = <0-28>    optional: master GPIO for the "next song" button
;                          (to GND, internal pull-up). Default 2 (a genuine
;                          Pico's usual wiring) -- override for a clone board
;                          whose built-in button is wired elsewhere (e.g. a
;                          "USR" button on GPIO24).
;   preview = no | yes      default no. yes cuts every song short after
;                          preview_seconds of song time (counting through
;                          loop points) and advances to the next file, as if
;                          the skip button had been pressed -- for
;                          auditioning a whole card quickly.
;   preview_seconds = <n>   default 30. Only meaningful when preview = yes.
;   recursive = no | yes    default no (only the SD card ROOT's .vgm/.vgz are
;                          played; subdirectories are ignored). yes also
;                          walks every subdirectory, playing each folder's
;                          files in turn before moving to the next folder.
;                          shuffle above still applies PER FOLDER, not
;                          globally across the whole card.
;   root_dir = <path>       optional: scan starts inside this SD-card-relative
;                          folder instead of the SD card root, e.g.
;                          "GAMES/Sega" (a leading/trailing slash or a "0:"
;                          drive prefix, if given, is stripped). Independent
;                          of recursive above: root_dir alone plays only that
;                          folder's own files; combine with recursive = yes
;                          to walk everything under root_dir instead of the
;                          whole card. Default "" (the SD card root).

[player]
shuffle = no
; skip_button = 24     ; uncomment + set for a clone board's own button GPIO
; preview = no
; preview_seconds = 30
; recursive = no
; root_dir =           ; e.g. "GAMES/Sega" -- blank/unset means the SD card root

[sn76489]
enabled = yes
cs      = 12

[ym2612]
enabled = yes
cs      = 13

[ay8910]
enabled = yes
cs      = 14
gap     = 120

[ym2413]
enabled = yes
cs      = 15

[ym2151]
enabled = yes
cs      = 20
gap     = 0     ; BURST -- needed for FM-dense music (OutRun). See gap doc above.

[ym2203]
enabled = yes
cs      = 21

[scc]
enabled = yes
cs      = 22

[segapcm]
enabled = yes
cs      = 26
