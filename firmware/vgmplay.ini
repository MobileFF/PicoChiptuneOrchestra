; vgmplay.ini -- master (Raspberry Pi Pico) configuration
;
; Copy this file to the ROOT of the SD card (next to your .vgm/.vgz files).
; It is optional: with no file, the built-in defaults below are used.
; Read over USB CDC / UART at boot to confirm what was applied
; (see docs/design-notes.md 8.1).
;
; One [section] per sound chip. Keys (case-insensitive):
;   enabled = yes | no     turn this chip's slave on/off. Disabled = its CS GPIO
;                          is left free, and any .vgm/.vgz that needs this chip
;                          is skipped (not played with that voice missing).
;   cs      = <0-28>        master GPIO wired to this slave's chip-select.
;   gap     = <microsec>    optional: per-byte CS-pulse gap. Raise if a slave
;                          drops bytes (garbled sound); lower for tighter
;                          tempo. Default 40 (AY-3-8910 80, YM2151 0).
;                          gap = 0 -> BURST mode: all 3 bytes under one CS
;                          assertion (~6us/frame vs ~370us). The bus runs SPI
;                          mode 1 (CPHA=1) so this is reliable; it is the
;                          default for YM2151 (FM-dense music needs it). If a
;                          particular slave's link is marginal on burst
;                          (garbled notes / noise), set a nonzero gap here.
;
; Section names ignore case, dashes, underscores and spaces, so [AY-3-8910],
; [ay8910] and [Ay_8910] are the same. Lines starting with ; or # are
; comments. Anything you leave out keeps its default.

[sn76489]
enabled = yes
cs      = 12

[ym2612]
enabled = yes
cs      = 13

[ay8910]
enabled = yes
cs      = 14
gap     = 80

[ym2413]
enabled = yes
cs      = 15

[ym2151]
enabled = yes
cs      = 20
gap     = 0     ; BURST -- needed for FM-dense music (OutRun). See gap doc above.

[ym2203]
enabled = yes
cs      = 21

[scc]
enabled = yes
cs      = 22

[segapcm]
enabled = yes
cs      = 26
